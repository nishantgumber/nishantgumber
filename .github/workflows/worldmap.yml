name: Generate Visitor World Map

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate world map SVG
        run: python .github/scripts/generate_worldmap.py

      - name: Commit and push map
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add assets/worldmap.svg
          git diff --staged --quiet || git commit -m "chore: update visitor world map"
          git push
