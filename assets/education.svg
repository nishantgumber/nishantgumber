<svg viewBox="0 0 860 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <style>
      .uni  { font-family:'Segoe UI',system-ui,sans-serif; font-size:22px; font-weight:700; fill:#c0caf5; }
      .deg  { font-family:'Segoe UI',system-ui,sans-serif; font-size:15px; font-weight:600; fill:#7aa2f7; }
      .sub  { font-family:'Fira Code','Courier New',monospace; font-size:11px; fill:#565f89; }
      .lbl  { font-family:'Fira Code','Courier New',monospace; font-size:11px; fill:#565f89; }
      .tag  { font-family:'Fira Code','Courier New',monospace; font-size:11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="250" rx="8" fill="#16161e" stroke="#414868" stroke-width="0.8"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="250" rx="3" fill="url(#accentBar)"/>

  <!-- Icon -->
  <text x="26" y="55" font-size="30">🎓</text>

  <!-- University name -->
  <text x="70" y="48" class="uni">Dalhousie University</text>

  <!-- Degree -->
  <text x="70" y="70" class="deg">Bachelor of Applied Computer Science</text>

  <!-- Meta -->
  <text x="70" y="90" class="sub">Halifax, NS  ·  Expected December 2026  ·  Co-op Program</text>

  <!-- Divider — single full-width line -->
  <rect x="20" y="104" width="820" height="1" fill="#2a2b3d"/>

  <!-- Coursework label -->
  <text x="20" y="124" class="lbl">Relevant Coursework</text>

  <!-- ── Row 1: 3 badges ── -->
  <!-- Data Structures & Algorithms — wide badge -->
  <rect x="20"  y="133" width="198" height="24" rx="12" fill="#7aa2f7" opacity="0.1" stroke="#7aa2f7" stroke-width="0.8"/>
  <text x="119" y="149" text-anchor="middle" class="tag" fill="#7aa2f7">Data Structures &amp; Algorithms</text>

  <!-- Cloud Computing -->
  <rect x="228" y="133" width="140" height="24" rx="12" fill="#ff9e64" opacity="0.1" stroke="#ff9e64" stroke-width="0.8"/>
  <text x="298" y="149" text-anchor="middle" class="tag" fill="#ff9e64">Cloud Computing</text>

  <!-- Database Management -->
  <rect x="378" y="133" width="158" height="24" rx="12" fill="#9ece6a" opacity="0.1" stroke="#9ece6a" stroke-width="0.8"/>
  <text x="457" y="149" text-anchor="middle" class="tag" fill="#9ece6a">Database Management</text>

  <!-- ── Row 2: 3 badges ── -->
  <!-- Information Security -->
  <rect x="20"  y="166" width="148" height="24" rx="12" fill="#f7768e" opacity="0.1" stroke="#f7768e" stroke-width="0.8"/>
  <text x="94"  y="182" text-anchor="middle" class="tag" fill="#f7768e">Information Security</text>

  <!-- Object Oriented Design -->
  <rect x="178" y="166" width="162" height="24" rx="12" fill="#bb9af7" opacity="0.1" stroke="#bb9af7" stroke-width="0.8"/>
  <text x="259" y="182" text-anchor="middle" class="tag" fill="#bb9af7">Object Oriented Design</text>

  <!-- Web Development -->
  <rect x="350" y="166" width="136" height="24" rx="12" fill="#7dcfff" opacity="0.1" stroke="#7dcfff" stroke-width="0.8"/>
  <text x="418" y="182" text-anchor="middle" class="tag" fill="#7dcfff">Web Development</text>

  <!-- Divider 2 -->
  <rect x="20" y="202" width="820" height="1" fill="#2a2b3d"/>

  <!-- Status badges -->
  <rect x="20"  y="212" width="78" height="22" rx="11" fill="#9ece6a" opacity="0.12" stroke="#9ece6a" stroke-width="0.7"/>
  <text x="59"  y="227" text-anchor="middle" class="tag" fill="#9ece6a">● Active</text>

  <rect x="108" y="212" width="108" height="22" rx="11" fill="#7aa2f7" opacity="0.12" stroke="#7aa2f7" stroke-width="0.7"/>
  <text x="162" y="227" text-anchor="middle" class="tag" fill="#7aa2f7">4 Co-op Terms</text>

  <rect x="226" y="212" width="86" height="22" rx="11" fill="#bb9af7" opacity="0.12" stroke="#bb9af7" stroke-width="0.7"/>
  <text x="269" y="227" text-anchor="middle" class="tag" fill="#bb9af7">Dec 2026</text>

  <!-- Halifax right -->
  <text x="840" y="227" text-anchor="end" class="sub">Halifax, NS 🇨🇦</text>

</svg>
