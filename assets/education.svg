<svg viewBox="0 0 860 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .uni  { font-family:'Segoe UI',system-ui,sans-serif; font-size:20px; font-weight:700; fill:#c0caf5; }
      .deg  { font-family:'Segoe UI',system-ui,sans-serif; font-size:14px; font-weight:600; fill:#7aa2f7; }
      .sub  { font-family:'Fira Code','Courier New',monospace; font-size:11px; fill:#565f89; }
      .lbl  { font-family:'Fira Code','Courier New',monospace; font-size:11px; fill:#565f89; }
      .tag  { font-family:'Fira Code','Courier New',monospace; font-size:10px; }
      .card { animation:fadeIn 0.8s ease 0.2s both; }
      .ln   { stroke-dasharray:820; stroke-dashoffset:820; animation:drawLine 1.2s ease 0.6s forwards; }
      @keyframes fadeIn   { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
      @keyframes drawLine { to{stroke-dashoffset:0} }
    </style>
  </defs>

  <rect width="860" height="240" rx="8" fill="#0D1117"/>

  <g class="card">
    <!-- Card bg -->
    <rect x="0" y="0" width="860" height="240" rx="8" fill="#16161e" stroke="#414868" stroke-width="0.8"/>
    <!-- Left accent bar -->
    <rect x="0" y="0" width="5" height="240" rx="3" fill="url(#accentBar)"/>

    <!-- Icon -->
    <text x="26" y="52" font-size="28">🎓</text>

    <!-- University -->
    <text x="66" y="44" class="uni">Dalhousie University</text>
    <!-- Degree -->
    <text x="66" y="62" class="deg">Bachelor of Applied Computer Science</text>
    <!-- Meta -->
    <text x="66" y="80" class="sub">Halifax, NS  ·  Expected December 2026  ·  Co-op Program</text>

    <!-- Divider -->
    <line class="ln" x1="20" y1="96" x2="840" y2="96" stroke="#2a2b3d" stroke-width="1"/>

    <!-- Coursework label -->
    <text x="20" y="116" class="lbl">Relevant Coursework</text>

    <!-- Row 1 of badges — 3 badges -->
    <!-- Data Structures & Algorithms -->
    <rect x="20"  y="124" width="178" height="22" rx="11" fill="#7aa2f7" opacity="0.1" stroke="#7aa2f7" stroke-width="0.7"/>
    <text x="109" y="139" text-anchor="middle" class="tag" fill="#7aa2f7">Data Structures &amp; Algorithms</text>

    <!-- Cloud Computing -->
    <rect x="206" y="124" width="120" height="22" rx="11" fill="#ff9e64" opacity="0.1" stroke="#ff9e64" stroke-width="0.7"/>
    <text x="266" y="139" text-anchor="middle" class="tag" fill="#ff9e64">Cloud Computing</text>

    <!-- Database Management -->
    <rect x="334" y="124" width="136" height="22" rx="11" fill="#9ece6a" opacity="0.1" stroke="#9ece6a" stroke-width="0.7"/>
    <text x="402" y="139" text-anchor="middle" class="tag" fill="#9ece6a">Database Management</text>

    <!-- Row 2 of badges — 3 badges -->
    <!-- Information Security -->
    <rect x="20"  y="153" width="126" height="22" rx="11" fill="#f7768e" opacity="0.1" stroke="#f7768e" stroke-width="0.7"/>
    <text x="83"  y="168" text-anchor="middle" class="tag" fill="#f7768e">Information Security</text>

    <!-- Object Oriented Design -->
    <rect x="154" y="153" width="140" height="22" rx="11" fill="#bb9af7" opacity="0.1" stroke="#bb9af7" stroke-width="0.7"/>
    <text x="224" y="168" text-anchor="middle" class="tag" fill="#bb9af7">Object Oriented Design</text>

    <!-- Web Development -->
    <rect x="302" y="153" width="116" height="22" rx="11" fill="#7dcfff" opacity="0.1" stroke="#7dcfff" stroke-width="0.7"/>
    <text x="360" y="168" text-anchor="middle" class="tag" fill="#7dcfff">Web Development</text>

    <!-- Divider 2 -->
    <line x1="20" y1="188" x2="840" y2="188" stroke="#2a2b3d" stroke-width="0.8"/>

    <!-- Status badges -->
    <rect x="20"  y="198" width="72" height="20" rx="10" fill="#9ece6a" opacity="0.12" stroke="#9ece6a" stroke-width="0.6"/>
    <text x="56"  y="212" text-anchor="middle" class="tag" fill="#9ece6a">● Active</text>

    <rect x="100" y="198" width="96" height="20" rx="10" fill="#7aa2f7" opacity="0.12" stroke="#7aa2f7" stroke-width="0.6"/>
    <text x="148" y="212" text-anchor="middle" class="tag" fill="#7aa2f7">4 Co-op Terms</text>

    <rect x="204" y="198" width="78" height="20" rx="10" fill="#bb9af7" opacity="0.12" stroke="#bb9af7" stroke-width="0.6"/>
    <text x="243" y="212" text-anchor="middle" class="tag" fill="#bb9af7">Dec 2026</text>

    <!-- Halifax right-aligned -->
    <text x="840" y="212" text-anchor="end" class="sub">Halifax, NS 🇨🇦</text>
  </g>
</svg>
