<svg viewBox="0 0 860 48" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="860" height="48" rx="6" fill="#16161e" stroke="#1e2030" stroke-width="1"/>

  <!-- Live status dot with SMIL pulse -->
  <circle cx="20" cy="24" r="5" fill="#9ece6a">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- "now:" label -->
  <text x="32" y="29" font-family="'Fira Code', Courier New, monospace" font-size="11" fill="#565f89">now:</text>

  <!-- Clip to keep text inside bounds -->
  <clipPath id="clip">
    <rect x="70" y="0" width="790" height="48"/>
  </clipPath>

  <!-- Scrolling text group — SMIL translateX animation -->
  <g clip-path="url(#clip)">
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0,0"
        to="-1408,0"
        dur="28s"
        repeatCount="indefinite"/>

      <!-- Copy 1 -->
      <text x="70"   y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#a9b1d6">🚀 Shipping Clozzr — AI SaaS for mortgage brokers</text>
      <text x="430"  y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#565f89">  ·  </text>
      <text x="460"  y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#a9b1d6">☁️ AWS CDK infra deployments @ BMO</text>
      <text x="720"  y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#565f89">  ·  </text>
      <text x="750"  y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#a9b1d6">🎵 Contributing to Audoji RCS platform</text>
      <text x="1020" y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#565f89">  ·  </text>
      <text x="1050" y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#a9b1d6">📚 Deepening system design skills</text>
      <text x="1280" y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#565f89">  ·  </text>
      <text x="1310" y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#a9b1d6">🎓 Graduating Dec 2026</text>

      <!-- Copy 2 (seamless loop) -->
      <text x="1478" y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#a9b1d6">🚀 Shipping Clozzr — AI SaaS for mortgage brokers</text>
      <text x="1838" y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#565f89">  ·  </text>
      <text x="1868" y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#a9b1d6">☁️ AWS CDK infra deployments @ BMO</text>
      <text x="2128" y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#565f89">  ·  </text>
      <text x="2158" y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#a9b1d6">🎵 Contributing to Audoji RCS platform</text>
      <text x="2428" y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#565f89">  ·  </text>
      <text x="2458" y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#a9b1d6">📚 Deepening system design skills</text>
      <text x="2688" y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#565f89">  ·  </text>
      <text x="2718" y="29" font-family="'Fira Code', Courier New, monospace" font-size="13" fill="#a9b1d6">🎓 Graduating Dec 2026</text>
    </g>
  </g>

  <!-- Fade masks using SMIL-safe rect overlays -->
  <rect x="70"  y="0" width="40"  height="48" fill="#16161e" opacity="0.9"/>
  <rect x="820" y="0" width="40"  height="48" fill="#16161e" opacity="0.9"/>

</svg>
