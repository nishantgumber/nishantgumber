    <text x="114" y="237" text-anchor="middle" class="tag" fill="#ED8B00">Java/JSP</text>
    <rect x="150" y="225" width="72" height="17" rx="8" fill="#336791" opacity="0.2"/>
    <text x="186" y="237" text-anchor="middle" class="tag" fill="#7aa2f7">PostgreSQL</text>
    <rect x="228" y="225" width="78" height="17" rx="8" fill="#F7DF1E" opacity="0.12"/>
    <text x="267" y="237" text-anchor="middle" class="tag" fill="#F7DF1E">JavaScript</text>
    <rect x="312" y="225" width="80" height="17" rx="8" fill="#EE0000" opacity="0.12"/>
    <text x="352" y="237" text-anchor="middle" class="tag" fill="#ff7070">Rate Limiting</text>
    <rect x="398" y="225" width="78" height="17" rx="8" fill="#7dcfff" opacity="0.12"/>
    <text x="437" y="237" text-anchor="middle" class="tag" fill="#7dcfff">Geolocation</text>
  </g>

  <!-- ══ ROLE 3 ══ -->
  <g class="d3">
    <circle cx="42" cy="308" r="10" fill="#0D1117" stroke="#bb9af7" stroke-width="2"/>
    <circle cx="42" cy="308" r="4"  fill="#bb9af7" filter="url(#glow)"/>
  </g>
  <g class="c3">
