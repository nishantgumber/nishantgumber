<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#9ece6a"/>
      <stop offset="33%"  stop-color="#7dcfff"/>
      <stop offset="66%"  stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .role { font-family:'Segoe UI',system-ui,sans-serif; font-size:14px; font-weight:700; fill:#c0caf5; }
      .co   { font-family:'Segoe UI',system-ui,sans-serif; font-size:12px; fill:#7aa2f7; }
      .date { font-family:'Fira Code','Courier New',monospace; font-size:11px; fill:#565f89; }
      .tag  { font-family:'Fira Code','Courier New',monospace; font-size:10px; }
      .vline { stroke-dasharray:440; stroke-dashoffset:440; animation:drawLine 2s ease 0.2s forwards; }
      .c1 { animation:slideIn 0.5s ease 0.3s both; }
      .c2 { animation:slideIn 0.5s ease 0.7s both; }
      .c3 { animation:slideIn 0.5s ease 1.1s both; }
      .c4 { animation:slideIn 0.5s ease 1.5s both; }
      .d1 { animation:popIn 0.4s ease 0.3s both; transform-origin:42px 68px; }
      .d2 { animation:popIn 0.4s ease 0.7s both; transform-origin:42px 188px; }
      .d3 { animation:popIn 0.4s ease 1.1s both; transform-origin:42px 308px; }
      .d4 { animation:popIn 0.4s ease 1.5s both; transform-origin:42px 428px; }
      .pulse { animation:pulse 2.5s ease-in-out infinite; transform-origin:42px 68px; }
      @keyframes drawLine { to { stroke-dashoffset:0; } }
      @keyframes slideIn  { from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:translateX(0)} }
      @keyframes popIn    { 0%{opacity:0;transform:scale(0)} 70%{transform:scale(1.3)} 100%{opacity:1;transform:scale(1)} }
      @keyframes pulse    { 0%,100%{r:18;opacity:0.2} 50%{r:26;opacity:0.05} }
    </style>
  </defs>

  <rect width="860" height="520" rx="8" fill="#0D1117"/>

  <!-- Vertical connecting line -->
  <line class="vline" x1="42" y1="68" x2="42" y2="460"
        stroke="url(#lineGrad)" stroke-width="2"/>

  <!-- ══ ROLE 1 — Current (top, newest) ══ -->
  <circle class="pulse" cx="42" cy="68" r="18" fill="#9ece6a"/>
  <g class="d1">
    <circle cx="42" cy="68" r="12" fill="#0D1117" stroke="#9ece6a" stroke-width="2.5"/>
    <circle cx="42" cy="68" r="5"  fill="#9ece6a" filter="url(#glow)"/>
  </g>
  <g class="c1">
    <rect x="68" y="42" width="774" height="90" rx="6" fill="#16161e" stroke="#9ece6a" stroke-width="0.8"/>
    <rect x="700" y="51" width="130" height="18" rx="9" fill="#9ece6a" opacity="0.12"/>
    <text x="765" y="64" text-anchor="middle" class="tag" fill="#9ece6a">● CURRENT</text>
    <text x="84"  y="64" class="role">Software Engineer Intern</text>
    <text x="84"  y="80" class="date">May 2026 – Aug 2026</text>
    <text x="84"  y="96" class="co">🏦  BMO Financial Group  ·  Toronto, ON</text>
    <rect x="84"  y="107" width="72" height="17" rx="8" fill="#FF9900" opacity="0.15"/>
    <text x="120" y="119" text-anchor="middle" class="tag" fill="#FF9900">AWS ECR/ECS</text>
    <rect x="162" y="107" width="52" height="17" rx="8" fill="#7aa2f7" opacity="0.15"/>
    <text x="188" y="119" text-anchor="middle" class="tag" fill="#7aa2f7">CDK IaC</text>
    <rect x="220" y="107" width="80" height="17" rx="8" fill="#0078D7" opacity="0.15"/>
    <text x="260" y="119" text-anchor="middle" class="tag" fill="#5ea8ff">Azure DevOps</text>
    <rect x="306" y="107" width="52" height="17" rx="8" fill="#EE0000" opacity="0.15"/>
    <text x="332" y="119" text-anchor="middle" class="tag" fill="#ff7070">Ansible</text>
    <rect x="364" y="107" width="44" height="17" rx="8" fill="#61DAFB" opacity="0.12"/>
    <text x="386" y="119" text-anchor="middle" class="tag" fill="#61DAFB">React</text>
    <rect x="414" y="107" width="52" height="17" rx="8" fill="#bb9af7" opacity="0.15"/>
    <text x="440" y="119" text-anchor="middle" class="tag" fill="#bb9af7">CI/CD</text>
  </g>

  <!-- ══ ROLE 2 ══ -->
  <g class="d2">
    <circle cx="42" cy="188" r="10" fill="#0D1117" stroke="#7dcfff" stroke-width="2"/>
    <circle cx="42" cy="188" r="4"  fill="#7dcfff" filter="url(#glow)"/>
  </g>
  <g class="c2">
    <rect x="68" y="162" width="774" height="90" rx="6" fill="#16161e" stroke="#414868" stroke-width="0.8"/>
