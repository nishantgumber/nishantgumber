    <text x="84"  y="302" class="role">Business Analyst Intern (Technical)</text>
    <text x="84"  y="318" class="date">May 2025 – Aug 2025</text>
    <text x="84"  y="334" class="co">🏦  BMO Financial Group  ·  Halifax, NS</text>
    <rect x="84"  y="345" width="50" height="17" rx="8" fill="#3776AB" opacity="0.2"/>
    <text x="109" y="357" text-anchor="middle" class="tag" fill="#7aa2f7">Python</text>
    <rect x="140" y="345" width="56" height="17" rx="8" fill="#F2C811" opacity="0.15"/>
    <text x="168" y="357" text-anchor="middle" class="tag" fill="#F2C811">Power BI</text>
    <rect x="202" y="345" width="100" height="17" rx="8" fill="#EE4444" opacity="0.12"/>
    <text x="252" y="357" text-anchor="middle" class="tag" fill="#ff7070">Fraud Detection</text>
    <rect x="308" y="345" width="110" height="17" rx="8" fill="#bb9af7" opacity="0.12"/>
    <text x="363" y="357" text-anchor="middle" class="tag" fill="#bb9af7">Rule-based Logic</text>
  </g>

  <!-- ══ ROLE 4 (oldest) ══ -->
  <g class="d4">
    <circle cx="42" cy="428" r="10" fill="#0D1117" stroke="#7aa2f7" stroke-width="2"/>
    <circle cx="42" cy="428" r="4"  fill="#7aa2f7" filter="url(#glow)"/>
  </g>
  <g class="c4">
