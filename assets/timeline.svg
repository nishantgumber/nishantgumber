  <!-- Footer label -->
  <text x="430" y="510" text-anchor="middle"
        font-family="'Fira Code',monospace" font-size="10" fill="#414868">
    ── 4 consecutive terms · support → data → engineering → cloud ──
  </text>
</svg>
