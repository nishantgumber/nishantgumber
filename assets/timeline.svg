<svg viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tlLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7aa2f7" stop-opacity="0.2"/>
      <stop offset="20%"  stop-color="#7aa2f7" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#bb9af7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .tl-label {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 11px;
        fill: #565f89;
      }
      .tl-role {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #c0caf5;
      }
      .tl-company {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 11px;
        fill: #7aa2f7;
      }
      .tl-current {
        fill: #9ece6a;
        font-weight: 700;
      }
      .timeline-line {
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: drawLine 2s ease 0.3s forwards;
      }
      .n1 { animation: popIn 0.4s ease 0.5s both; transform-origin: 100px 100px; }
      .n2 { animation: popIn 0.4s ease 1.0s both; transform-origin: 270px 100px; }
      .n3 { animation: popIn 0.4s ease 1.5s both; transform-origin: 440px 100px; }
      .n4 { animation: popIn 0.4s ease 2.0s both; transform-origin: 610px 100px; }
      .n5 { animation: popIn 0.4s ease 2.5s both; transform-origin: 780px 100px; }
      .t1 { animation: fadeUp 0.5s ease 0.6s both; }
      .t2 { animation: fadeUp 0.5s ease 1.1s both; }
      .t3 { animation: fadeUp 0.5s ease 1.6s both; }
      .t4 { animation: fadeUp 0.5s ease 2.1s both; }
      .t5 { animation: fadeUp 0.5s ease 2.6s both; }
      .pulse {
        animation: pulse 2.5s ease-in-out infinite;
        transform-origin: 780px 100px;
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes popIn {
        0%   { opacity: 0; transform: scale(0); }
        70%  { transform: scale(1.2); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1);   opacity: 1; }
        50%       { transform: scale(1.3); opacity: 0.7; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="200" fill="#0D1117" rx="8"/>

  <!-- Timeline baseline -->
  <line class="timeline-line" x1="60" y1="100" x2="820" y2="100" stroke="url(#tlLine)" stroke-width="2"/>

  <!-- ── Node 1: Support Analyst 2024 ── -->
  <g class="n1">
    <circle cx="100" cy="100" r="10" fill="#1a1b27" stroke="#565f89" stroke-width="2"/>
    <circle cx="100" cy="100" r="4"  fill="#565f89"/>
  </g>
  <g class="t1">
    <text x="100" y="74"  class="tl-label"   text-anchor="middle">May 2024</text>
    <text x="100" y="128" class="tl-role"    text-anchor="middle">Support</text>
    <text x="100" y="142" class="tl-role"    text-anchor="middle">Analyst</text>
    <text x="100" y="157" class="tl-company" text-anchor="middle">BMO</text>
  </g>

  <!-- ── Node 2: BA Intern 2025 ── -->
  <g class="n2">
    <circle cx="270" cy="100" r="10" fill="#1a1b27" stroke="#7aa2f7" stroke-width="2"/>
    <circle cx="270" cy="100" r="4"  fill="#7aa2f7"/>
  </g>
  <g class="t2">
    <text x="270" y="74"  class="tl-label"   text-anchor="middle">May 2025</text>
    <text x="270" y="128" class="tl-role"    text-anchor="middle">Business</text>
    <text x="270" y="142" class="tl-role"    text-anchor="middle">Analyst</text>
    <text x="270" y="157" class="tl-company" text-anchor="middle">BMO</text>
  </g>

  <!-- ── Node 3: SWE Intern Sep 2025 ── -->
  <g class="n3">
    <circle cx="440" cy="100" r="10" fill="#1a1b27" stroke="#bb9af7" stroke-width="2"/>
    <circle cx="440" cy="100" r="4"  fill="#bb9af7"/>
  </g>
  <g class="t3">
    <text x="440" y="74"  class="tl-label"   text-anchor="middle">Sep 2025</text>
    <text x="440" y="128" class="tl-role"    text-anchor="middle">Software</text>
    <text x="440" y="142" class="tl-role"    text-anchor="middle">Developer</text>
    <text x="440" y="157" class="tl-company" text-anchor="middle">BMO</text>
  </g>

  <!-- ── Node 4: SWE Intern May 2026 ── -->
  <g class="n4">
    <circle cx="610" cy="100" r="10" fill="#1a1b27" stroke="#7dcfff" stroke-width="2"/>
    <circle cx="610" cy="100" r="4"  fill="#7dcfff"/>
  </g>
  <g class="t4">
    <text x="610" y="74"  class="tl-label"   text-anchor="middle">May 2026</text>
    <text x="610" y="128" class="tl-role"    text-anchor="middle">Software</text>
    <text x="610" y="142" class="tl-role"    text-anchor="middle">Engineer</text>
    <text x="610" y="157" class="tl-company" text-anchor="middle">BMO</text>
  </g>

  <!-- ── Node 5: Clozzr — current (pulsing) ── -->
  <g class="n5">
    <circle cx="780" cy="100" r="14" fill="#9ece6a" opacity="0.15" class="pulse" filter="url(#nodeGlow)"/>
    <circle cx="780" cy="100" r="10" fill="#1a1b27" stroke="#9ece6a" stroke-width="2.5"/>
    <circle cx="780" cy="100" r="4"  fill="#9ece6a"/>
  </g>
  <g class="t5">
    <text x="780" y="72"  class="tl-label"    text-anchor="middle">2026 →</text>
    <text x="780" y="128" class="tl-role tl-current" text-anchor="middle">Clozzr</text>
    <text x="780" y="142" class="tl-role tl-current" text-anchor="middle">Founder</text>
    <text x="780" y="157" class="tl-company"  text-anchor="middle" fill="#9ece6a">Active 🚀</text>
  </g>

  <!-- Connector label -->
  <text x="430" y="190" text-anchor="middle" fill="#565f89" font-size="10" font-family="'Fira Code', monospace">── 4 consecutive internships · increasing scope ──</text>
</svg>
