    <text x="84"  y="438" class="date">May 2024 – Aug 2024</text>
    <text x="84"  y="454" class="co">🏦  BMO Financial Group  ·  Halifax, NS</text>
    <rect x="84"  y="465" width="90" height="17" rx="8" fill="#FF9900" opacity="0.15"/>
    <text x="129" y="477" text-anchor="middle" class="tag" fill="#FF9900">AWS OpenSearch</text>
    <rect x="180" y="465" width="50" height="17" rx="8" fill="#3776AB" opacity="0.2"/>
    <text x="205" y="477" text-anchor="middle" class="tag" fill="#7aa2f7">Python</text>
    <rect x="236" y="465" width="58" height="17" rx="8" fill="#43B02A" opacity="0.15"/>
    <text x="265" y="477" text-anchor="middle" class="tag" fill="#43B02A">Selenium</text>
    <rect x="300" y="465" width="100" height="17" rx="8" fill="#7aa2f7" opacity="0.12"/>
    <text x="350" y="477" text-anchor="middle" class="tag" fill="#7aa2f7">Infra Monitoring</text>
