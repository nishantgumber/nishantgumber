<svg viewBox="0 0 520 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="radarFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7aa2f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="radarGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .radar-label {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 12px;
        fill: #c0caf5;
        font-weight: 500;
      }
      .radar-sub {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 10px;
        fill: #565f89;
      }
      .radar-pct {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 11px;
        font-weight: 700;
      }
      .radar-polygon {
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: drawRadar 2s ease 0.5s forwards;
      }
      .radar-fill {
        opacity: 0;
        animation: fadeInFill 1s ease 2s forwards;
      }
      .grid-hex {
        animation: fadeIn 0.5s ease 0.2s both;
      }
      .node {
        animation: popIn 0.3s ease both;
      }
      .n-fc  { animation-delay: 2.3s; }
      .n-cl  { animation-delay: 2.4s; }
      .n-be  { animation-delay: 2.5s; }
      .n-dv  { animation-delay: 2.6s; }
      .n-ai  { animation-delay: 2.7s; }
      .title {
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 13px;
        fill: #565f89;
      }
      @keyframes drawRadar {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fadeInFill {
        to { opacity: 1; }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 0.3; }
      }
      @keyframes popIn {
        0%   { opacity: 0; transform: scale(0); }
        70%  { transform: scale(1.3); }
        100% { opacity: 1; transform: scale(1); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="520" height="400" fill="#0D1117" rx="8"/>

  <!-- Title -->
  <text x="260" y="28" text-anchor="middle" class="title">skill radar</text>

  <!-- ── Radar centre: 260, 210 ── -->
  <!-- Grid rings (20%, 40%, 60%, 80%, 100%) -->
  <!-- 5 axes: Front-end(top), Cloud(top-right), DevOps(bottom-right), Back-end(bottom-left), AI/SaaS(top-left) -->
  <!-- Angles: 270°(top), 342°(top-right), 54°(bottom-right), 126°(bottom-left), 198°(top-left) -->
  <!-- sin/cos for each: top(0,-1), TR(0.588,-0.809), BR(0.951,0.309), BL(-0.951,0.309), TL(-0.588,-0.809) -->

  <g transform="translate(260,210)">

    <!-- Grid rings -->
    <g class="grid-hex" stroke="#1e2030" stroke-width="1" fill="none">
      <!-- 20% ring r=24 -->
      <polygon points="0,-24 14.1,-19.4 22.8,7.4 0,22.8 -22.8,7.4 -14.1,-19.4" opacity="0.4"/>
      <!-- 40% ring r=48 -->
      <polygon points="0,-48 28.2,-38.8 45.6,14.8 0,45.6 -45.6,14.8 -28.2,-38.8" opacity="0.4"/>
      <!-- 60% ring r=72 -->
      <polygon points="0,-72 42.3,-58.2 68.4,22.2 0,68.4 -68.4,22.2 -42.3,-58.2" opacity="0.4"/>
      <!-- 80% ring r=96 -->
      <polygon points="0,-96 56.4,-77.6 91.3,29.7 0,91.3 -91.3,29.7 -56.4,-77.6" opacity="0.4"/>
      <!-- 100% ring r=120 -->
      <polygon points="0,-120 70.6,-97 114.1,37.1 0,114.1 -114.1,37.1 -70.6,-97" opacity="0.4"/>
    </g>

    <!-- Axis lines -->
    <g stroke="#1e2030" stroke-width="1" opacity="0.6">
      <line x1="0" y1="0" x2="0"      y2="-120"/>
      <line x1="0" y1="0" x2="70.6"   y2="-97"/>
      <line x1="0" y1="0" x2="114.1"  y2="37.1"/>
      <line x1="0" y1="0" x2="0"      y2="114.1"/>
      <line x1="0" y1="0" x2="-114.1" y2="37.1"/>
      <line x1="0" y1="0" x2="-70.6"  y2="-97"/>
    </g>

    <!--
      Skill values:
      Frontend  = 88% → 105.6 → point (0, -105.6)
      Cloud     = 82% → 98.4  → (57.9, -79.6)
      DevOps    = 78% → 93.6  → (89.0,  28.9)
      Backend   = 75% → 90    → (0,      90)
      AI/SaaS   = 70% → 84    → (-79.9,  26.0)
      Security  = 72% → 86.4  → (-60.8, -83.5)
    -->

    <!-- Skill polygon fill -->
    <polygon class="radar-fill"
      points="0,-105.6 57.9,-79.6 89.0,28.9 0,90 -79.9,26.0 -60.8,-83.5"
      fill="url(#radarFill)" stroke="none"/>

    <!-- Skill polygon outline -->
    <polygon class="radar-polygon"
      points="0,-105.6 57.9,-79.6 89.0,28.9 0,90 -79.9,26.0 -60.8,-83.5"
      fill="none" stroke="#7aa2f7" stroke-width="2" filter="url(#radarGlow)"/>

    <!-- Skill nodes -->
    <g>
      <circle class="node n-fc" cx="0"     cy="-105.6" r="5" fill="#7aa2f7" transform-origin="0 -105.6"/>
      <circle class="node n-cl" cx="57.9"  cy="-79.6"  r="5" fill="#bb9af7" transform-origin="57.9 -79.6"/>
      <circle class="node n-be" cx="89.0"  cy="28.9"   r="5" fill="#7dcfff" transform-origin="89 28.9"/>
      <circle class="node n-dv" cx="0"     cy="90"     r="5" fill="#9ece6a" transform-origin="0 90"/>
      <circle class="node n-ai" cx="-79.9" cy="26.0"   r="5" fill="#ff9e64" transform-origin="-79.9 26"/>
      <circle class="node n-fc" cx="-60.8" cy="-83.5"  r="5" fill="#f7768e" transform-origin="-60.8 -83.5"/>
    </g>

  </g>

  <!-- Labels outside the radar -->
  <!-- Frontend — top -->
  <text x="260" y="78"  class="radar-label" text-anchor="middle">Frontend</text>
  <text x="260" y="91"  class="radar-sub"   text-anchor="middle">Next.js · React · TS</text>
  <text x="260" y="104" class="radar-pct"   text-anchor="middle" fill="#7aa2f7">88%</text>

  <!-- Cloud — top right -->
  <text x="408" y="118" class="radar-label" text-anchor="start">Cloud</text>
  <text x="408" y="131" class="radar-sub"   text-anchor="start">AWS · CDK · Docker</text>
  <text x="408" y="144" class="radar-pct"   text-anchor="start" fill="#bb9af7">82%</text>

  <!-- DevOps — bottom right -->
  <text x="400" y="268" class="radar-label" text-anchor="start">DevOps</text>
  <text x="400" y="281" class="radar-sub"   text-anchor="start">CI/CD · Ansible · Git</text>
  <text x="400" y="294" class="radar-pct"   text-anchor="start" fill="#7dcfff">78%</text>

  <!-- Backend — bottom -->
  <text x="260" y="350" class="radar-label" text-anchor="middle">Backend</text>
  <text x="260" y="363" class="radar-sub"   text-anchor="middle">Node · SQL · APIs</text>
  <text x="260" y="376" class="radar-pct"   text-anchor="middle" fill="#9ece6a">75%</text>

  <!-- AI/SaaS — bottom left -->
  <text x="116" y="268" class="radar-label" text-anchor="end">AI / SaaS</text>
  <text x="116" y="281" class="radar-sub"   text-anchor="end">Claude · Supabase</text>
  <text x="116" y="294" class="radar-pct"   text-anchor="end" fill="#ff9e64">70%</text>

  <!-- Security — top left -->
  <text x="118" y="118" class="radar-label" text-anchor="end">Security</text>
  <text x="118" y="131" class="radar-sub"   text-anchor="end">Auth · PIPEDA · Rate limit</text>
  <text x="118" y="144" class="radar-pct"   text-anchor="end" fill="#f7768e">72%</text>

</svg>
